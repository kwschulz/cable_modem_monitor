name: Commit Message Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional

      # Config lives at repo root in commitlint.config.js — same file
      # the local pre-commit `commit-msg` hook uses, so CI and local
      # validate against the same rules.

      - name: Validate PR commits
        run: |
          git fetch origin ${{ github.base_ref }}
          commit_range="origin/${{ github.base_ref }}..HEAD"
          failures=0
          linted=0

          while IFS= read -r sha; do
            author_name="$(git show -s --format='%an' "$sha")"
            if [[ "$author_name" == *"[bot]" ]]; then
              echo "Skipping bot-authored commit $sha ($author_name)"
              continue
            fi

            linted=$((linted + 1))
            commit_message="$(git show -s --format=%B "$sha")"
            echo "$commit_message" | npx commitlint --verbose || failures=1
          done < <(git rev-list --reverse "$commit_range")

          if [[ "$linted" -eq 0 ]]; then
            echo "No non-bot commits to lint."
          fi

          if [[ "$failures" -ne 0 ]]; then
            exit 1
          fi

      # Reported through the run summary rather than a PR comment: a fork's
      # token is read-only, so createComment 403s and the contributor sees a
      # red check with no explanation of what to change.
      - name: Explain the expected format
        if: failure()
        run: |
          {
            echo "## Commit message validation failed"
            echo ""
            echo "Commits follow Conventional Commits:"
            echo ""
            echo '```'
            echo "<type>(<optional scope>): <description>"
            echo '```'
            echo ""
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, deps"
            echo ""
            echo "Examples:"
            echo ""
            echo '```'
            echo "fix: treat channels without lock_status as locked"
            echo "feat(catalog): add Arris SB8200"
            echo '```'
            echo ""
            echo "Amend with \`git commit --amend\`, then push with \`--force-with-lease\`."
            echo "See CONTRIBUTING.md section Commit Message Format."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Success message
        if: success()
        run: |
          echo "All commit messages are valid."
