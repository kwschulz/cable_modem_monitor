name: Check Commit Email Privacy

# pull_request_target, not pull_request: a PR from a fork runs pull_request
# with a read-only token, so the informational comment 403s and the check
# reports failure even though it passed. pull_request_target runs with this
# repo's token instead.
#
# SAFETY: this workflow must never execute code from the PR. It checks out
# the base branch (the default under pull_request_target) and reads only
# commit metadata (author name and email) from the PR head. Do not add a
# checkout of the PR head, and do not run scripts, builds, or installs from
# it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  check-email:
    name: Check for Personal Emails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit author emails
        id: check-emails
        run: |
          # Metadata only. Fetch the PR head into a local ref; nothing from it
          # is ever executed.
          git fetch origin ${{ github.base_ref }}
          git fetch origin refs/pull/${{ github.event.pull_request.number }}/head:pr-head

          # Allowed email patterns
          ALLOWED_PATTERNS=(
            "@users.noreply.github.com$"
            "^noreply@anthropic.com$"
            "^noreply@github.com$"
            "^.*\[bot\]@users.noreply.github.com$"
          )

          # Check each commit
          FOUND_PERSONAL=0
          PERSONAL_EMAIL_COMMITS=""

          for commit in $(git rev-list origin/${{ github.base_ref }}..pr-head); do
            EMAIL=$(git log -1 --format='%ae' $commit)
            AUTHOR=$(git log -1 --format='%an' $commit)
            SHORT=$(git rev-parse --short $commit)

            ALLOWED=0
            for pattern in "${ALLOWED_PATTERNS[@]}"; do
              if echo "$EMAIL" | grep -qE "$pattern"; then
                ALLOWED=1
                break
              fi
            done

            if [ $ALLOWED -eq 0 ]; then
              # The address is never carried past this step. Naming a commit
              # and its author is enough for the contributor to act, and the
              # comment is permanently public, so printing the address there
              # creates the exposure the check exists to warn about. The mask
              # keeps a later debug echo from reintroducing it via the log.
              echo "::add-mask::$EMAIL"
              FOUND_PERSONAL=1
              PERSONAL_EMAIL_COMMITS="${PERSONAL_EMAIL_COMMITS}\n- \`${SHORT}\` by ${AUTHOR}"
            fi
          done

          if [ $FOUND_PERSONAL -eq 1 ]; then
            echo "found_personal=true" >> $GITHUB_OUTPUT
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo -e "$PERSONAL_EMAIL_COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo ""
            echo "⚠️  Personal email(s) detected in commits (informational only)"
            echo "    This check does NOT block the PR - it's just a friendly reminder."
          else
            echo "found_personal=false" >> $GITHUB_OUTPUT
            echo "✅ All commit emails are privacy-safe!"
          fi

      - name: Comment on PR (informational)
        if: steps.check-emails.outputs.found_personal == 'true'
        uses: actions/github-script@v9
        env:
          PERSONAL_EMAIL_COMMITS: ${{ steps.check-emails.outputs.commits }}
        with:
          script: |
            // Check if we already commented on this PR to avoid spam.
            // Paginated: an unpaginated read stops at 30 comments, and missing
            // the existing comment on a long thread posts the address twice.
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(comment =>
              comment.body.includes('Personal Email Detected in Commits') &&
              comment.user.type === 'Bot'
            );

            if (botComment) {
              console.log('Already commented on this PR, skipping');
              return;
            }

            const commits = process.env.PERSONAL_EMAIL_COMMITS;

            const message = [
              '## :information_source: Personal Email Detected in Commits',
              '',
              '> **Note:** This is an informational check only. It does **not** block your PR.',
              '',
              'These commits were authored with a personal email address rather than',
              'a GitHub noreply address:',
              commits,
              '',
              'The address is deliberately not repeated here, because this comment is',
              'public. To see it: `git log --format=\'%h %ae\' -2`',
              '',
              '### Why This Matters',
              'Personal emails in git history are **permanently public** and can be harvested by spammers.',
              '',
              '### How to Fix (Optional but Recommended)',
              '',
              '1. **Configure GitHub email privacy:**',
              '   - Go to [GitHub Email Settings](https://github.com/settings/emails)',
              '   - Check "Keep my email addresses private"',
              '   - Copy your noreply address (e.g., `ID+username@users.noreply.github.com`)',
              '',
              '2. **For this repo, run the setup script:**',
              '   ```bash',
              '   ./scripts/dev/setup-git-email.sh',
              '   ```',
              '',
              '3. **Or use VS Code task:** "Setup Git Email Privacy"',
              '',
              '### For Future Commits',
              'Once configured, all your future commits will use the privacy-safe email automatically.',
              '',
              '---',
              '*This check helps protect contributor privacy. Feel free to merge if you\'re okay with the email being public.*',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      # The comment must not outlive the fix it asks for. Once the contributor
      # has rewritten their commits the check passes, but the comment stays on
      # the PR with the address in plain text and only a maintainer can remove
      # it. Deleting it here closes that gap without anyone having to ask.
      - name: Remove the comment once the emails are fixed
        if: steps.check-emails.outputs.found_personal == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(comment =>
              comment.body.includes('Personal Email Detected in Commits') &&
              comment.user.type === 'Bot'
            );

            if (!botComment) {
              return;
            }

            // Best effort: a cleanup failure must not turn the check red for a
            // contributor whose commits are already correct.
            try {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
              console.log(`Removed the stale comment ${botComment.id}`);
            } catch (error) {
              core.warning(`Could not remove the stale comment: ${error.message}`);
            }
