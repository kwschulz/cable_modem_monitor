manufacturer: Technicolor
model: XB6
model_aliases:
  - "CGM4140COM"
brands:
  - "Xfinity"
transport: http
default_host: "10.0.0.1"

timeout: 25

auth:
  strategy: form
  action: "/check.jst"
  username_field: username
  password_field: password
  cookie_name: "DUKSID"

  hidden_fields:
    locale: "false"
  success:
    redirect: "/at_a_glance.jst"
hardware:
  docsis_version: "3.1"
  chipset: "Broadcom BCM3390"
  release_date: "2017"

status: confirmed

sources:
  release_date: "[Next TV / Multichannel News, December 6, 2017](https://www.nexttv.com/news/comcast-goes-wide-docsis-31-gigabit-gateway-416930) — Comcast national rollout of the xFi Advanced Gateway (XB6), naming Technicolor as builder of the Broadcom-chipset CGM4140COM"
  brands: "[TechInfoDepot — Technicolor CGM4140COM (Xfinity XB6)](https://techinfodepot.shoutwiki.com/wiki/Technicolor_CGM4140COM)"
  model_aliases: "[TechInfoDepot — Technicolor CGM4140COM (XB6)](https://techinfodepot.shoutwiki.com/wiki/Technicolor_CGM4140COM)"
  auth_config: "[#111 XB6](https://github.com/solentlabs/cable_modem_monitor/issues/111)"
  chipset: "[TechInfoDepot](https://techinfodepot.shoutwiki.com/wiki/Technicolor_CGM4140COM)"

attribution:
  contributors:
    - github: https://github.com/Boby360
      contribution: "XB6 and CGM4140COM HAR captures (Issue #111)"

isps:
  - Rogers
notes: |
  DOCSIS 3.1 gateway (CGM4140COM). Same .jst page platform as XB7/CGM4331COM.
  Transposed table format: rows are metrics, columns are channels.
  Session cookie: DUKSID (vs XB7's "session"). CSRF: csrfp_token (OWASP CSRFP).
  Login form includes hidden field locale=false.
  Default IP: 10.0.0.1 (router mode).
  One third-party author email in a bundled JS library was redacted
  by hand: har-capture does not scan strings inside bundled assets.
  The private Wi-Fi network name on connection_status.jst was redacted
  by hand: har-capture had no labeled-SSID detector at capture time.
  The same string in a bundled jQuery author comment is left intact.

references:
  issues:
    - "[#111 — [Modem Request] Technicolor CGM4140COM (XB6)](https://github.com/solentlabs/cable_modem_monitor/issues/111)"
