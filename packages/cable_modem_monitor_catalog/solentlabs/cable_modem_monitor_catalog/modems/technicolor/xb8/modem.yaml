manufacturer: Technicolor
model: XB8
model_aliases:
  - "CGM4981COM"
brands:
  - "Xfinity"
  - "Panoramic Wifi"
transport: http
default_host: "10.0.0.1"

auth:
  strategy: form
  action: "/check.jst"
  username_field: username
  password_field: password
  cookie_name: "DUKSID"

  success:
    redirect: "/at_a_glance.jst"

actions:
  logout:
    type: http
    method: GET
    endpoint: "/home_loggedout.jst"
    # source_inferred from the toolbar Logout link present on every
    # captured page and from global.js (no logout request in the capture).
    # requires_session not set (defaults to false) pending contributor
    # confirmation whether a Cookie header appears in the logout request.

hardware:
  docsis_version: "3.1"
  release_date: "2022"

status: confirmed

sources:
  brands: "Xfinity: [FCC XB8/CGM4981COM user guide](https://fcc.report/FCC-ID/G954981X/5542915.pdf); Panoramic Wifi: [Cox Technicolor CGM4981 support page](https://www.cox.com/residential/support/technicolor-cgm4981.html)"
  model_aliases: "[FCC XB8/CGM4981COM user guide](https://fcc.report/FCC-ID/G954981X/5542915.pdf); [DSLReports — Next Gateway XB8 Technicolor CGM4981COM](https://www.dslreports.com/forum/r33227126-Next-Gateway-XB8-Technicolor-CGM4981COM-Wi-Fi-6E)"
  auth_config: "[#194 XB8 error graphs](https://github.com/solentlabs/cable_modem_monitor/issues/194) HAR capture (POST /check.jst with plain username and password fields, 302 to at_a_glance.jst, DUKSID session cookie)"
  release_date: "Xfinity rollout began 2022: [DSLReports — Next Gateway XB8](https://www.dslreports.com/forum/r33227126-Next-Gateway-XB8-Technicolor-CGM4981COM-Wi-Fi-6E); [Xfinity Community Forum — NEW xFi Gateway XB8](https://forums.xfinity.com/conversations/your-home-network/new-xfi-gateway-xb8/6216d91580db9c3cdd5e96fc)"
