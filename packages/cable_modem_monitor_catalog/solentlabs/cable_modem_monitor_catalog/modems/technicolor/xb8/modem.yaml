notes: |
  DOCSIS 3.1 Wi-Fi 6E cable modem + router gateway (CGM4981COM),
  successor to the XB7 (CGM4331COM). Same web UI family as the XB6 and
  XB10: form authentication to /check.jst with a DUKSID session cookie,
  transposed channel tables on /network_setup.jst, spaced-colon uptime
  format "X days Xh:Xm:Xs".
  Firmware renders the SC-QAM fallback "TDMA" channel type for OFDMA
  upstream channels (upstream channel 4 reports Modulation OFDMA with
  Channel Type TDMA, symbol rate 0).
  Quirk, error count duplication, observed on XB8 as on XB7: QAM
  channel 29 reports correctable and uncorrectable codeword counts
  identical to OFDM channel 34 (1811327204 and 137079716 on both).
  Aggregate intentionally omitted for the same reason as the XB7 entry:
  a downstream.qam sum reads 1.81 billion against a true QAM total of
  841 thousand, so the modem exposes no error-total or error-rate
  sensors. Per-channel error counts are unaffected.
  The Logout endpoint is source_inferred; the capture contains no
  logout request. No reboot control was captured, so the entry ships
  without a restart action.
  Hand-applied sanitization: the Device Label Information block on
  /network_setup.jst renders the factory Wi-Fi SSID, the default Wi-Fi
  password, the WPS PIN, and the unit serial number in plain text. All
  four values are substituted with [REDACTED] in the fixture. The
  capture was sanitized with har-capture 0.8.2, which redacted none of
  them; 0.12.1 redacts the WPS PIN and the serial but still passes the
  default password through, and its validate reports no error on the
  file. None of the four is parsed.
