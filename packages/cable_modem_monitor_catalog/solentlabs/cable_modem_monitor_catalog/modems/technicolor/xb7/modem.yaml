manufacturer: Technicolor
model: XB7
model_aliases:
  - "CGM4331COM"
brands:
  - "Xfinity"
  - "Panoramic Wifi"
transport: http
default_host: "10.0.0.1"

timeout: 25

auth:
  strategy: form
  action: "/check.jst"
  username_field: username
  password_field: password
  cookie_name: "session"

  success:
    redirect: "/at_a_glance.jst"
hardware:
  docsis_version: "3.1"
  chipset: "Broadcom BCM3390"
  release_date: "2020"

status: confirmed

sources:
  brands: "Xfinity: [DSLReports XB7 thread](https://www.dslreports.com/forum/r32469291-Equip-XB7-Technicolor-CGM4331COM-Arris-TG4482-Wireless-AX-Wi-Fi-6); Panoramic Wifi: [Cox setup guide](https://www.cox.com/content/dam/cox/residential/support/internet/print_media/TechnicolorCGM4331_EasyConnectGuide.pdf)"
  model_aliases: "[DSLReports — XB7 Technicolor CGM4331COM](https://www.dslreports.com/forum/r32469291-Equip-XB7-Technicolor-CGM4331COM-Arris-TG4482-Wireless-AX-Wi-Fi-6)"
  auth_config: "[#2 Technicolor XB7](https://github.com/solentlabs/cable_modem_monitor/issues/2)"
  chipset: "[WikiDevi](https://wikidevi.wi-cat.ru/Technicolor_CGM4331COM)"
  detection_hints: "[#2 Technicolor XB7](https://github.com/solentlabs/cable_modem_monitor/issues/2)"
attribution:
  contributors:
    - github: https://github.com/esand
      contribution:
        "[Issue #2](https://github.com/solentlabs/cable_modem_monitor/issues/2)
        verification"

isps:
  - Rogers
  - Comcast
  - Xfinity
notes: |
  DOCSIS 3.1 cable modem + router gateway (CGM4331COM).
  Transposed table format: rows are metrics, columns are channels.
  Default IP: 10.0.0.1 (router mode) or 192.168.100.1 (modem mode).
  Form-based authentication to /check.jst endpoint.
  System uptime format: "X days Xh: Xm: Xs" (note spaces around colons).
  May have localized variants (Italian translations found in Rogers/Italian market).
  Quirk — BCM3390 error count duplication: channel 17 (primary QAM256)
  reports corrected and uncorrected counts identical to channel 34 (OFDM).
  Confirmed per-model (observed across two independent units). Same
  chipset-level pattern as SB8200. Aggregate intentionally omitted because
  the duplicated OFDM data makes QAM totals unreliable.
  The factory Wi-Fi SSID and default password in the Device Label
  Information block on network_setup.jst were redacted by hand:
  har-capture had no labeled-credential detector at capture time.
  Assembled fixture — not a full wire capture. test_data/modem.har holds a
  real har-capture response for /network_setup.jst; the /check.jst login
  and the /at_a_glance.jst landing are hand-built. The login's 302 Location
  is the modem's own. The landing entry records only that following that
  redirect returns 200, inferred from the redirect target plus the XB6 and
  XB10 captures of the same firmware family, which both serve
  /at_a_glance.jst 200. Unobserved on this unit: the landing response body
  and headers, the check.jst POST mechanics, the session cookie value. The
  landing body is never parsed (parser.yaml declares only
  /network_setup.jst), so it is left empty rather than invented.
  status: confirmed rests on test_data/modem.verified.json (CGM4331COM,
  34 downstream / 5 upstream, docsis_status Operational), not on this
  fixture. Replace the fixture with a real full-session HAR when an XB7
  owner contributes one.
