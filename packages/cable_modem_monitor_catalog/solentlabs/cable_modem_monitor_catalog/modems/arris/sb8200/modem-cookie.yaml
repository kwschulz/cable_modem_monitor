manufacturer: ARRIS
model: SB8200
transport: http
default_host: "192.168.100.1"

auth:
  strategy: url_token
  login_page: "/cmconnectionstatus.html"
  login_prefix: ""
  ajax_login: true
  auth_header_data: false
  cookie_name: "credential"
  success_indicator: "Downstream Bonded Channels"

hardware:
  docsis_version: "3.1"
  hw_version: v7
  firmware: AB01
  chipset: "Broadcom BCM3390"
  release_date: "2017"

status: awaiting_verification

sources:
  auth_config: "[#124 SB8200 bare base64 variant](https://github.com/solentlabs/cable_modem_monitor/issues/124)"
  chipset: "[DeviWiki](https://deviwiki.com/wiki/Arris_SB8200)"
  hardware: "[ARRIS SB8200 page](https://www.arris.com/surfboard/products/cable-modems/sb8200/)"

attribution:
  contributors:
    - github: https://github.com/northstarcomp
      contribution: "HW v7 capture and testing (Issue #124)"

isps:
  - Spectrum

notes: |
  HW v7 firmware variant (AB01.02.053_082120). Uses bare base64
  credentials in query string — no login_ prefix, no ct_ token.
  Cookie name is "credential" instead of "sessionId".
  Same page structure and parser as other SB8200 variants.

  Hand-applied sanitization (modem-cookie.har): the login credential
  in log.entries[13] was replaced in request.url and in
  request.queryString[0].name — YWRtaW46c2FuaXRpemVk, base64 of
  admin:sanitized. har-capture's automated pass missed it because the
  credential appears ONLY in the URL: a bare query key carries no field
  name for the strict rules to match, and 0.11.1's propagation sweep
  rewrites only values already redacted elsewhere in the same capture,
  so there was no redacted copy to propagate from. Format-preserving
  substitution rather than [REDACTED] keeps the bare-base64 wire shape
  this variant exists to document. Substitution only — no entry,
  header or field was removed. Detection now lives in
  check_fixture_pii.find_url_secrets.

references:
  issues:
    - "[#124 — Arris SB8200 HTTPS variant (bare base64 token)](https://github.com/solentlabs/cable_modem_monitor/issues/124)"
